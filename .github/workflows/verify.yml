name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: node scripts/verify-maintenance.mjs
      - run: node --test scripts/harness-doctor.test.mjs
  package:
    name: Pack once
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.matrix.outputs.hosts }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-package.mjs
      - run: node scripts/verify-maintenance.mjs
      - id: matrix
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'hosts=' + JSON.stringify(require('./compatibility.json').supportedHosts.map(h => h.version)) + '\n')"
      - name: Create immutable candidate
        shell: bash
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          mv release/*.tgz release/package.tgz
          cd release
          sha256sum package.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate
          path: release/
          if-no-files-found: error
  runtime:
    name: Harness / ${{ matrix.host }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.package.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      # Ordinary test effects must be inside the existing /tmp workspace.
      - name: Exact host product fixture (no real API credentials)
        run: node scripts/harness-runtime-verify.mjs --host-version '${{ matrix.host }}' --artifact release/package.tgz --out '/tmp/auto-runtime-${{ matrix.host }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-evidence-${{ matrix.host }}
          path: |
            /tmp/auto-runtime-${{ matrix.host }}/*.json
          if-no-files-found: warn
